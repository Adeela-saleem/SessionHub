# Development overlay: hot reload for both apps, Vite dev server instead
# of the nginx image.  Usage:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  api:
    build:
      target: development
    environment:
      NODE_ENV: development
      # The Vite dev server runs on 5173, not the nginx port the base file allows.
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
    command: sh -c "npx prisma migrate deploy && npm run start:dev"

  web:
    build:
      dockerfile: apps/web/Dockerfile.dev
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000
